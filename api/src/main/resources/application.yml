server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gigahack26-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/gigahack26}
    username: ${POSTGRES_USER:gigahack}
    password: ${POSTGRES_PASSWORD:gigahack}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 400
        order_inserts: true
        order_updates: true
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/gigahack26}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: ${CACHE_TTL_MS:60000}
  ai:
    mcp:
      server:
        name: gigahack26-api
        version: 0.0.1
        protocol: STATELESS
        type: SYNC
        streamable-http:
          mcp-endpoint: /api/mcp

app:
  enrichment:
    provider: ${ENRICHMENT_PROVIDER:none}
    api-key: ${ENRICHMENT_API_KEY:}
    base-url: ${ENRICHMENT_BASE_URL:https://api.peopledatalabs.com/v5/person/enrich}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  classifier:
    engine: ${CLASSIFIER_ENGINE:local}
    confidence-floor: 0.5
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      concurrency: ${CLASSIFIER_CONCURRENCY:8}
      timeout-ms: 25000
  scoring:
    base-rate: ${SCORING_BASE_RATE:0.25}
    priority-threshold: ${SCORING_PRIORITY_THRESHOLD:0.55}
    nurture-threshold: ${SCORING_NURTURE_THRESHOLD:0.45}
    watch-threshold: ${SCORING_WATCH_THRESHOLD:0.28}
    rank-discount: ${SCORING_RANK_DISCOUNT:0.5}
    icp-min-employees: ${ICP_MIN_EMPLOYEES:200}
    geography-gate: ${ICP_GEOGRAPHY_GATE:true}
    size-gate: ${ICP_SIZE_GATE:true}
    competitor-gate: ${ICP_COMPETITOR_GATE:true}
    industry-gate: ${ICP_INDUSTRY_GATE:false}
    confidence-shrink: ${SCORING_CONFIDENCE_SHRINK:1.0}
    icp-industries: ${ICP_INDUSTRIES:}
    icp-countries: ${ICP_COUNTRIES:MD,RO,DE,FR,IT,ES,PT,NL,BE,LU,AT,CH,PL,CZ,SK,HU,BG,RS,UA,TR,GB,IE,SE,NO,DK,FI,GR,HR,SI,EE,LV,LT,US,CA}
  refresh:
    enabled: ${REFRESH_ENABLED:true}
    interval-ms: ${REFRESH_INTERVAL_MS:43200000}
    initial-delay-ms: ${REFRESH_INITIAL_DELAY_MS:120000}
  corpus:
    raw-path: ${CORPUS_RAW_PATH:corpus/raw.json}
    signals-path: ${CORPUS_SIGNALS_PATH:corpus/signals.json}
    people-path: ${CORPUS_PEOPLE_PATH:corpus/people.json}
    seed-on-startup: ${CORPUS_SEED:true}
    force-reseed: ${CORPUS_FORCE_RESEED:false}
    admin-enabled: ${ADMIN_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.pistonpunk.gigahack26: info
