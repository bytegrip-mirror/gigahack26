server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gigahack26-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/gigahack26}
    username: ${POSTGRES_USER:gigahack}
    password: ${POSTGRES_PASSWORD:gigahack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/gigahack26}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
