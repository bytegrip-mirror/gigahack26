services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigahack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigahack}
      POSTGRES_DB: gigahack26
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gigahack -d gigahack26']
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: gigahack
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-gigahack}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      SERVER_PORT: 8080
      POSTGRES_URL: jdbc:postgresql://postgres:5432/gigahack26
      POSTGRES_USER: gigahack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigahack}
      MONGO_URI: mongodb://gigahack:${MONGO_PASSWORD:-gigahack}@mongo:27017/gigahack26?authSource=admin
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:5173
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
